server:
    port: 8081

spring:
    application:
        name: "n3_seguranca_backend"

    datasource:
        driverClassName: "org.h2.Driver"
        username: "sa"
        password: ""
        url: jdbc:h2:file:C:\Dev\Android\AppGoogle\forca_vendas_pac_backend/pac_db

    jpa:
        database-platform: "org.hibernate.dialect.H2Dialect"
        show-sql: true
        hibernate:
            ddl-auto: "update"

    h2:
        console:
            enabled: true
            path: "/h2-console"

    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: "http://localhost:8080/realms/n3-seguranca"
                    jwk-set-uri: "http://localhost:8080/realms/n3-seguranca/protocol/openid-connect/certs"
